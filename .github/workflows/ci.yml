name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked research dependencies
        run: uv sync --locked --group publication
      - name: Compile Python sources
        run: uv run python -m compileall -q analysis scripts tests
      - name: Run publication-security regression tests
        run: uv run python -m unittest discover -s tests
      - name: Regenerate core research outputs in an isolated tree
        run: uv run python scripts/reproduce_research.py --check
      - name: Verify portable current publication
        run: uv run --group publication python scripts/build_current_publication.py --check
      - name: Verify source-linked public evidence
        run: uv run --group publication python scripts/export_public_evidence.py --check
      - name: Check the public release tree
        run: uv run python scripts/check_public_release.py
      - name: Audit calculations
        run: uv run python scripts/audit_aether_calculations.py
      - name: Check source register
        run: uv run python scripts/check_source_register.py

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
